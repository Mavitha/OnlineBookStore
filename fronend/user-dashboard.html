<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aetheria Books | User Dashboard</title>
  <meta name="description" content="User dashboard for Aetheria Books customers." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />

  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html#hero" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-book-bookmark"></i></div>
        <div class="logo-text">Aetheria<span>Books</span></div>
      </a>

      <!-- Added Search Bar instead of Navigation Links -->
      <div class="nav-search-bar" style="display:flex; align-items:center; background:var(--bg-surface-elevated); padding:0.4rem 1rem; border-radius:20px; border:1px solid var(--border-subtle); min-width: 250px;">
        <i class="fa-solid fa-magnifying-glass" style="color:var(--text-muted); margin-right:8px;"></i>
        <input type="text" placeholder="Search titles, authors..." style="border:none; background:transparent; outline:none; color:var(--text-main); font-family:var(--font-body); font-size:0.9rem; width: 100%;" />
      </div>

      <div class="nav-actions">
        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="btn-icon" title="Toggle Light/Dark Mode" style="background:transparent; border:none; color:var(--text-main); font-size:1.2rem; cursor:pointer; margin-right:15px;">
          <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
        
        <!-- User Alias Icon -->
        <a href="user-dashboard.html" class="nav-link active" title="User Dashboard" style="font-size: 1.25rem; margin-right: 15px;">
          <i class="fa-solid fa-circle-user"></i>
        </a>

        <!-- Sign In button -->
        <a href="admin.html" class="role-btn active">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </a>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <section class="content-section" style="padding-top: 4rem;">
      <div class="section-header">
        <h2><i class="fa-solid fa-hand-wave" style="color: var(--accent-gold);"></i> Welcome Back, Eleanor!</h2>
        <p>Manage your account details and view your recent orders.</p>
      </div>
    </section>

    <!-- ===================================================================
         USER SECTION 1: PROFILE DETAILS
         =================================================================== -->
    <section id="profile" class="content-section">
      <div class="section-header" style="text-align: left; max-width: 100%;">
        <h3><i class="fa-solid fa-id-card"></i> Account Information</h3>
      </div>

      <div class="card-box" style="margin-bottom: 2rem;">
        <form action="#profile" method="GET" onsubmit="alert('Profile updated successfully!'); return false;">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" value="Eleanor Vance" />
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" value="eleanor@example.com" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Default Shipping Address</label>
            <input type="text" class="form-control" value="742 Evergreen Terrace, Springfield" />
          </div>

          <button type="submit" class="btn-primary" style="margin-top:1rem;">
            <i class="fa-solid fa-user-pen"></i> Update Profile
          </button>
        </form>
      </div>
    </section>


  </main>

  <footer style="text-align:center; padding: 2rem 1rem; color:var(--text-muted); font-size:0.85rem; border-top:1px solid var(--border-subtle); margin-top:4rem;">
    &copy; 2026 Aetheria Books. Traditional Single Page Book Store Application.
  </footer>
</body>
</html>
